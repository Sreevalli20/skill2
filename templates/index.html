<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Information App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Weather</h1>
      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button type="button" id="unit-c" class="active" aria-pressed="true">°C</button>
        <button type="button" id="unit-f" aria-pressed="false">°F</button>
      </div>
    </header>

    <form id="search-form" class="search-bar" autocomplete="off">
      <input
        type="search"
        id="city-input"
        name="city"
        placeholder="Search for a city..."
        aria-label="City name"
        required
      />
      <button type="submit">Search</button>
    </form>

    <section id="history" class="history" hidden>
      <span class="history-label">Recent:</span>
      <div id="history-list" class="history-list"></div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="weather-card" class="weather-card" hidden>
      <div class="location">
        <h2 id="location-name"></h2>
        <p id="location-detail" class="location-detail"></p>
        <p id="observed-time" class="observed-time"></p>
      </div>

      <div class="current">
        <div id="weather-icon" class="weather-icon" aria-hidden="true"></div>
        <div class="temperature">
          <span id="temperature"></span>
          <span id="condition"></span>
        </div>
      </div>

      <div class="cards">
        <div class="card">
          <span class="card-icon">🌡️</span>
          <span class="card-label">Feels like</span>
          <span class="card-value" id="feels-like"></span>
        </div>
        <div class="card">
          <span class="card-icon">💧</span>
          <span class="card-label">Humidity</span>
          <span class="card-value" id="humidity"></span>
        </div>
        <div class="card">
          <span class="card-icon">💨</span>
          <span class="card-label">Wind</span>
          <span class="card-value" id="wind"></span>
        </div>
        <div class="card">
          <span class="card-icon">☁️</span>
          <span class="card-label">Cloud cover</span>
          <span class="card-value" id="cloud-cover"></span>
        </div>
        <div class="card">
          <span class="card-icon">🌧️</span>
          <span class="card-label">Precipitation</span>
          <span class="card-value" id="precipitation"></span>
        </div>
      </div>

      <div id="forecast" class="forecast" hidden>
        <h3>5-day forecast</h3>
        <div id="forecast-list" class="forecast-list"></div>
      </div>
    </section>

    <footer class="footer">
      <p>Weather data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (free, no API key required).</p>
    </footer>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
